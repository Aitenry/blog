<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aitenry 的个人站 · 琉璃博客 — 写代码，也写生活。技术文章、开发日记与开源项目。" />
    <meta name="theme-color" content="#14120E" />
    <script>
      // 首屏前应用主题：读取 localStorage，回退到系统偏好。
      // 挂在 <html> 上（而非应用根节点），保证 portal 弹层（相册灯箱等）也在主题作用域内。
      (function () {
        try {
          var stored = localStorage.getItem('blog-theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { /* ignore */ }
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aitenry · 写代码，也写生活" />
    <meta property="og:description" content="Aitenry 的个人站 — 写代码，也写生活。技术文章、开发日记与开源项目。" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <title>Aitenry · 写代码，也写生活</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
